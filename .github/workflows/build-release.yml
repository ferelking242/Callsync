name: Build Release APK — CallSync Uploader

on:
  push:
    branches: [ main ]
    tags:     [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Optimized Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD:   ${{ secrets.KEY_PASSWORD }}
        run: |
          # KEYSTORE_BASE64 doit toujours être défini — keystore permanent p12
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERREUR: le secret KEYSTORE_BASE64 est absent. Configurez-le dans les secrets du repo."
            exit 1
          fi
          KEYSTORE_FILE="${{ github.workspace }}/callsync-release.p12"
          echo "Decoding permanent keystore from secret..."
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          echo "SIGN_STORE_PASS=$STORE_PASSWORD" >> $GITHUB_ENV
          echo "SIGN_KEY_ALIAS=upload"            >> $GITHUB_ENV
          echo "SIGN_KEY_PASS=$KEY_PASSWORD"      >> $GITHUB_ENV
          echo "KEYSTORE_PATH=$KEYSTORE_FILE"     >> $GITHUB_ENV

      - name: Build Optimized Release APK
        env:
          KEYSTORE_PATH:  ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.SIGN_STORE_PASS }}
          KEY_PASSWORD:   ${{ env.SIGN_KEY_PASS }}
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --parallel \
            --build-cache \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC" \
            --stacktrace

      - name: Show APK size
        run: |
          ls -lh app/build/outputs/apk/release/*.apk || echo "No APK found"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: callsync-uploader-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          name: "CallSync Uploader ${{ github.ref_name }}"
          body: |
            ## CallSync Uploader ${{ github.ref_name }}

            ### Changements
            - Build release R8/ProGuard optimisé (minification + shrinkResources)
            - Viewer supprimé — app 100% dédiée à l'upload
            - Auto-détection du dossier d'enregistrements
            - Déduplication SHA256 (local + serveur)
            - Auto-restart ntfy-style (AlarmManager + WorkManager + START_STICKY)
            - Zéro action humaine requise
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
