name: callsync_client
description: CallSync Client — Viewer & receiver for call recordings
version: 1.1.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # HTTP
  http: ^1.2.1
  crypto: ^3.0.5
  workmanager: ^0.9.0+3

  # Storage
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  path: ^1.9.0

  # Audio playback
  just_audio: ^0.9.40

  # Formatting
  intl: ^0.19.0

  # Auto-update via GitHub releases
  package_info_plus: ^8.0.0
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
