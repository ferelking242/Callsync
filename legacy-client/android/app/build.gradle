plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystorePath = System.getenv("KEYSTORE_PATH")
def hasKeystore  = keystorePath != null && new File(keystorePath).exists()

android {
    namespace "com.example.callsync_client"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions { jvmTarget = "1.8" }

    defaultConfig {
        applicationId "com.example.callsync_client"
        minSdk 24
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    if (hasKeystore) {
        signingConfigs {
            release {
                storeFile     file(keystorePath)
                storePassword System.getenv("STORE_PASSWORD") ?: ''
                keyAlias      System.getenv("KEY_ALIAS")      ?: 'upload'
                keyPassword   System.getenv("KEY_PASSWORD")   ?: ''
            }
        }
    }

    buildTypes {
        release {
            if (hasKeystore) { signingConfig signingConfigs.release }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

flutter {
    source "../.."
}
