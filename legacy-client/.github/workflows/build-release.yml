name: Build Release APK — CallSync Client (Viewer)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # ── Stable keystore: cached across runs so every APK has the same cert ──
      - name: Restore stable keystore from cache
        id: ks-cache
        uses: actions/cache@v4
        with:
          path: ci-keystore.jks
          key: callsync-stable-keystore-v1

      - name: Setup signing keystore
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "Using keystore from secret"
            echo "${KEYSTORE_BASE64}" | base64 --decode > "${{ github.workspace }}/ci-keystore.jks"
            PASS="${STORE_PASSWORD:-callsync2026}"
            ALIAS="${KEY_ALIAS:-release}"
            KPASS="${KEY_PASSWORD:-callsync2026}"
          elif [ "${{ steps.ks-cache.outputs.cache-hit }}" == "true" ]; then
            echo "Using cached stable keystore"
            PASS="callsync2026"
            ALIAS="release"
            KPASS="callsync2026"
          else
            echo "Generating new stable keystore (will be cached for next runs)"
            keytool -genkey -v \
              -keystore "${{ github.workspace }}/ci-keystore.jks" \
              -alias release -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=CallSync,OU=App,O=CallSync,L=Paris,ST=IDF,C=FR" \
              -storepass callsync2026 -keypass callsync2026 -noprompt
            PASS="callsync2026"
            ALIAS="release"
            KPASS="callsync2026"
          fi
          echo "SIGN_STORE_PASS=$PASS"   >> $GITHUB_ENV
          echo "SIGN_KEY_ALIAS=$ALIAS"   >> $GITHUB_ENV
          echo "SIGN_KEY_PASS=$KPASS"    >> $GITHUB_ENV
          echo "KEYSTORE_PATH=${{ github.workspace }}/ci-keystore.jks" >> $GITHUB_ENV
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD:  ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS:       ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:    ${{ secrets.KEY_PASSWORD }}

      - name: Build Release APKs (split per ABI)
        env:
          STORE_PASSWORD: ${{ env.SIGN_STORE_PASS }}
          KEY_ALIAS:      ${{ env.SIGN_KEY_ALIAS }}
          KEY_PASSWORD:   ${{ env.SIGN_KEY_PASS }}
        run: |
          flutter build apk --release \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --tree-shake-icons

      - name: Show APK sizes
        run: ls -lh build/app/outputs/flutter-apk/*.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: callsync-client-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 30

      - name: Create GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-*-release.apk
          generate_release_notes: true
          name: "CallSync Client ${{ github.ref_name }}"
          body: |
            ## CallSync Client ${{ github.ref_name }}

            ### Installation
            Télécharge le fichier correspondant à ton téléphone :
            - **arm64-v8a** → la plupart des téléphones récents (2015+)
            - **armeabi-v7a** → vieux téléphones 32-bit
            - **x86_64** → émulateurs Android

            ### Fonctionnalités
            - Connexion automatique au démarrage
            - Téléchargement auto de tous les enregistrements manquants
            - Streaming audio en direct si pas encore téléchargé
            - Badge vert ✓ sur les fichiers téléchargés
            - Suppression locale / serveur par swipe long press
            - Interface épurée page unique — Material 3 dark mode
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
